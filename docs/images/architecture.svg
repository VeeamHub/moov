<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 836" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="912" height="836" fill="#ffffff"/>

  <!-- ================= VMware vSphere (out of scope) ================= -->
  <rect x="286" y="14" width="452" height="72" rx="10" fill="#f1f3f5" stroke="#b7c0cb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="512" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7684">VMware vSphere</text>
  <text x="512" y="65" text-anchor="middle" font-size="12.5" fill="#8a93a0">Customer production · out of Moov's scope</text>

  <!-- arrow: vSphere -> Veeam (out of scope, dashed grey) -->
  <line x1="512" y1="86" x2="512" y2="120" stroke="#aab4bf" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="512,128 507,118 517,118" fill="#aab4bf"/>

  <!-- ================= Veeam B&R V13 (SOURCE) ================= -->
  <rect x="266" y="128" width="492" height="86" rx="10" fill="#ffffff" stroke="#1f2733" stroke-width="2"/>
  <text x="288" y="164" font-size="16.5" font-weight="700" fill="#1e293b">Veeam Backup &amp; Replication V13</text>
  <text x="288" y="188" font-size="12.5" fill="#64707d">Backup repository · VBK / VIB</text>
  <rect x="646" y="140" width="90" height="26" rx="13" fill="#1b2430"/>
  <text x="691" y="157" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">SOURCE</text>

  <!-- arrow: Veeam -> Appliance (solid) + label -->
  <line x1="512" y1="214" x2="512" y2="296" stroke="#1f2733" stroke-width="2.2"/>
  <polygon points="512,304 507,294 517,294" fill="#1f2733"/>
  <text x="528" y="262" font-size="12.5" font-weight="600" fill="#1f2733">REST V13</text>

  <!-- ================= Operator ================= -->
  <rect x="14" y="344" width="140" height="74" rx="10" fill="#f1f3f5" stroke="#c2cad3" stroke-width="1.5"/>
  <text x="84" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Operator</text>
  <text x="84" y="398" text-anchor="middle" font-size="12" fill="#64707d">web browser</text>
  <!-- dashed connector Operator -> Appliance -->
  <line x1="154" y1="381" x2="256" y2="381" stroke="#8a93a0" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="262,381 252,376 252,386" fill="#8a93a0"/>
  <rect x="171" y="369" width="70" height="23" rx="11.5" fill="#ffffff" stroke="#c2cad3" stroke-width="1"/>
  <text x="206" y="385" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2733">HTTPS :9093</text>

  <!-- ================= Moov Appliance ================= -->
  <rect x="258" y="300" width="508" height="182" rx="12" fill="#f1f3f5" stroke="#1f2733" stroke-width="2"/>
  <text x="282" y="332" font-size="16.5" font-weight="700" fill="#1e293b">Moov Appliance</text>

  <text x="282" y="372" font-size="13.5" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2733">moov-core<tspan font-weight="400"> — web console · REST API (:9093)</tspan></text>
  <text x="282" y="392" font-size="12" fill="#64707d">orchestrator · embedded SQLite · local CA · mTLS</text>

  <line x1="282" y1="414" x2="742" y2="414" stroke="#d7dce2" stroke-width="1.2"/>

  <text x="282" y="446" font-size="13.5" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2733">moov-helper<tspan font-weight="400"> — local helper</tspan></text>
  <rect x="650" y="432" width="92" height="26" rx="13" fill="#1b2430"/>
  <text x="696" y="449" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#ffffff">PRIMARY</text>

  <!-- ================= bus to branches ================= -->
  <line x1="512" y1="482" x2="512" y2="512" stroke="#1f2733" stroke-width="2.2"/>
  <line x1="298" y1="512" x2="726" y2="512" stroke="#1f2733" stroke-width="2.2"/>
  <line x1="298" y1="512" x2="298" y2="556" stroke="#1f2733" stroke-width="2.2"/>
  <polygon points="298,564 293,554 303,554" fill="#1f2733"/>
  <line x1="726" y1="512" x2="726" y2="556" stroke="#1f2733" stroke-width="2.2"/>
  <polygon points="726,564 721,554 731,554" fill="#1f2733"/>

  <rect x="248" y="524" width="100" height="23" rx="11.5" fill="#ffffff" stroke="#c2cad3" stroke-width="1"/>
  <text x="298" y="540" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2733">mTLS · gRPC</text>
  <rect x="656" y="524" width="140" height="23" rx="11.5" fill="#ffffff" stroke="#c2cad3" stroke-width="1"/>
  <text x="726" y="540" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f2733">REST / SSH / libvirt</text>

  <!-- ================= Additional helpers ================= -->
  <rect x="123" y="566" width="352" height="118" rx="10" fill="#ffffff" stroke="#1f2733" stroke-width="2"/>
  <text x="145" y="600" font-size="15.5" font-weight="700" fill="#1e293b">Additional helpers</text>
  <rect x="368" y="586" width="86" height="24" rx="12" fill="#1b2430"/>
  <text x="411" y="602" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#ffffff">HELPER</text>
  <text x="145" y="628" font-size="12.5" fill="#64707d">Same appliance image</text>
  <text x="145" y="648" font-size="12.5" fill="#64707d">Horizontal scaling of the migration</text>

  <!-- ================= Migration targets ================= -->
  <rect x="551" y="566" width="355" height="140" rx="10" fill="#ffffff" stroke="#1f2733" stroke-width="2"/>
  <text x="575" y="600" font-size="15.5" font-weight="700" fill="#1e293b">Migration targets</text>
  <rect x="575" y="624" width="12" height="12" rx="2.5" fill="#1b2430"/>
  <text x="596" y="634" font-size="13" fill="#1e293b">Proxmox VE</text>
  <rect x="575" y="654" width="12" height="12" rx="2.5" fill="#1b2430"/>
  <text x="596" y="664" font-size="13" fill="#1e293b">oVirt / OLVM / RHV</text>
  <rect x="575" y="684" width="12" height="12" rx="2.5" fill="#1b2430"/>
  <text x="596" y="694" font-size="13" fill="#1e293b">HPE VM Essentials</text>

  <!-- ================= Legend ================= -->
  <rect x="190" y="768" width="536" height="50" rx="10" fill="#f6f7f9" stroke="#e3e7ec" stroke-width="1"/>
  <line x1="214" y1="793" x2="246" y2="793" stroke="#1f2733" stroke-width="2.4"/>
  <text x="256" y="797" font-size="12" fill="#4a5560">Active data flow</text>
  <line x1="392" y1="793" x2="424" y2="793" stroke="#8a93a0" stroke-width="2.4" stroke-dasharray="2 3" stroke-linecap="round"/>
  <text x="434" y="797" font-size="12" fill="#4a5560">Management / console</text>
  <line x1="606" y1="793" x2="638" y2="793" stroke="#aab4bf" stroke-width="2.4" stroke-dasharray="6 5"/>
  <text x="648" y="797" font-size="12" fill="#4a5560">Out of scope</text>
</svg>
